<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentScanRegister - Búsqueda de QR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .status.ok {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="file"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .qr-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .qr-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .qr-card h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .qr-card img {
            width: 100%;
            max-width: 200px;
            margin: 10px 0;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        .qr-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px;
        }

        .qr-card a:hover {
            background: #218838;
        }

        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stats-item {
            display: inline-block;
            margin-right: 30px;
        }

        .stats-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stats-label {
            font-size: 14px;
            color: #666;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 StudentScanRegister</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Sistema de Generación y Búsqueda de QR Estudiantil</p>

        <div id="status" class="status"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('busqueda')">🔍 Búsqueda</button>
            <button class="tab-btn" onclick="switchTab('alumnos')">👥 Todos los Alumnos</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 Cargar CSV</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 Estadísticas</button>
        </div>

        <!-- TAB 1: Búsqueda -->
        <div id="busqueda" class="tab-content active">
            <div class="search-box">
                <input type="text" id="busqueda-input" placeholder="Buscar por nombre de alumno...">
                <button onclick="buscarQR()">Buscar</button>
            </div>
            <div id="busqueda-resultados" class="results"></div>
        </div>

        <!-- TAB 2: Todos los Alumnos -->
        <div id="alumnos" class="tab-content">
            <button onclick="cargarTodos()">Cargar Todos los Alumnos</button>
            <div id="alumnos-resultados" class="results"></div>
        </div>

        <!-- TAB 3: Upload CSV -->
        <div id="upload" class="tab-content">
            <h3 style="margin-bottom: 15px;">Cargar Nuevo Archivo CSV</h3>
            <div class="search-box" style="flex-wrap: wrap;">
                <input type="file" id="csv-input" accept=".csv" style="flex: 1;">
                <button onclick="subirCSV()">Procesar CSV</button>
            </div>
            <div id="upload-mensaje"></div>
        </div>

        <!-- TAB 4: Estadísticas -->
        <div id="stats" class="tab-content">
            <h3 style="margin-bottom: 15px;">Estadísticas del Sistema</h3>
            <div id="stats-content" class="stats"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Verificar conexión
        window.onload = async () => {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                document.getElementById('status').innerHTML = `✅ ${data.mensaje}`;
                document.getElementById('status').className = 'status ok';
            } catch (e) {
                document.getElementById('status').innerHTML = `❌ Error: No se pudo conectar a la API (${API_URL})`;
                document.getElementById('status').className = 'status error';
            }
        };

        // Cambiar tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Buscar QR por nombre
        async function buscarQR() {
            const nombre = document.getElementById('busqueda-input').value.trim();
            if (!nombre) {
                alert('Ingresa un nombre para buscar');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/qr/nombre/${nombre}`);
                const data = await res.json();
                
                let html = '';
                if (data.total === 0) {
                    html = '<p style="text-align:center; color:#999;">No se encontraron resultados</p>';
                } else {
                    data.resultados.forEach(qr => {
                        html += generarQRCard(qr);
                    });
                }
                document.getElementById('busqueda-resultados').innerHTML = html;
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // Cargar todos los alumnos
        async function cargarTodos() {
            try {
                const res = await fetch(`${API_URL}/api/alumnos`);
                const data = await res.json();
                
                let html = `<p style="text-align:center; margin-bottom:20px;"><strong>Total: ${data.total} alumnos</strong></p>`;
                data.alumnos.forEach(alumno => {
                    html += generarQRCard(alumno, true);
                });
                document.getElementById('alumnos-resultados').innerHTML = html;
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // Subir CSV
        async function subirCSV() {
            const fileInput = document.getElementById('csv-input');
            if (!fileInput.files[0]) {
                alert('Selecciona un archivo CSV');
                return;
            }

            const formData = new FormData();
            formData.append('archivo', fileInput.files[0]);

            try {
                const res = await fetch(`${API_URL}/api/procesar`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                const mensajeDiv = document.getElementById('upload-mensaje');
                if (res.ok) {
                    mensajeDiv.innerHTML = `<div class="message success">✅ ${data.mensaje}</div>`;
                    fileInput.value = '';
                } else {
                    mensajeDiv.innerHTML = `<div class="message error">❌ Error: ${data.error}</div>`;
                }
            } catch (e) {
                document.getElementById('upload-mensaje').innerHTML = `<div class="message error">❌ Error: ${e.message}</div>`;
            }
        }

        // Cargar estadísticas
        async function cargarStats() {
            try {
                const res = await fetch(`${API_URL}/api/estadisticas`);
                const data = await res.json();
                
                let html = `
                    <div class="stats-item">
                        <div class="stats-value">${data.archivos_csv}</div>
                        <div class="stats-label">Archivos CSV</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-value">${data.qr_total}</div>
                        <div class="stats-label">Total de QR</div>
                    </div>
                `;
                document.getElementById('stats-content').innerHTML = html;
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // Generar card de QR
        function generarQRCard(qr, isAlumnoList = false) {
            const name = isAlumnoList ? qr.nombre : qr.nombre;
            const imgUrl = isAlumnoList ? qr.qr_url : qr.imagen_url;
            return `
                <div class="qr-card">
                    <h3>${name}</h3>
                    <img src="${API_URL}${imgUrl}" alt="QR">
                    <a href="${API_URL}${imgUrl}" download="${name}.png">⬇️ Descargar</a>
                </div>
            `;
        }

        // Cargar stats cuando sea visible
        document.addEventListener('click', function(e) {
            if (e.target.innerHTML && e.target.innerHTML.includes('Estadísticas')) {
                setTimeout(cargarStats, 100);
            }
        });
    </script>
</body>
</html>
